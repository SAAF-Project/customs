name: Criteria

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  criteria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run every criterion in AUDIT-CRITERIA.md (0 pass, 1 fail, 2 not tested)
        run: python3 -I scripts/check_criteria.py
